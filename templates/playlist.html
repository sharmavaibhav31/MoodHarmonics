{% extends "base.html" %}

{% block title %}Playlist - MoodHarmonics{% endblock %}

{% block content %}
<section class="playlist-section">
    <div class="playlist-container">
        <div class="playlist-header">
            <div>
                <h1 class="section-title">My Playlist</h1>
                <p class="subtitle-sm">Curated by MoodHarmonics AI</p>
            </div>
            <div class="toolbar">
                <button class="action-button" id="shuffleBtn">🔀 Shuffle</button>
                <input type="search" id="playlistSearch" class="toolbar-input" placeholder="Search tracks">
                <select id="playlistSort" class="toolbar-select">
                    <option value="new">Newest</option>
                    <option value="title">Title</option>
                    <option value="genre">Genre</option>
                </select>
            </div>
        </div>

        <div class="playlist-layout">
            <div id="playlistGrid" class="playlist-tracks"></div>
            <div class="lyrics-panel" id="lyricsPanel">
                <h3>Lyrics</h3>
                <div class="lyrics-content" id="playlistLyrics">
                    <p class="lyrics-placeholder">Select a track to view lyrics</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
