<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MoodHarmonics{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=3) }}">
</head>
<body class="dark-theme {% block body_class %}{% endblock %}">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h2>MoodHarmonics</h2>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}" class="nav-link">Home</a></li>
                <li><a href="{{ url_for('dashboard') }}" class="nav-link">Dashboard</a></li>
                <li><a href="{{ url_for('library') }}" class="nav-link">Library</a></li>
                <li><a href="{{ url_for('playlist') }}" class="nav-link">Playlist</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">
                <span class="theme-icon">☀️</span>
            </button>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Compact Mini Player -->
    <div id="miniPlayer" class="mini-player" aria-live="polite">
        <div class="mp-left">
            <div class="mp-art" id="mpArt"></div>
            <div class="mp-meta">
                <div class="mp-title" id="mpTitle">Not playing</div>
                <div class="mp-sub" id="mpSub">—</div>
            </div>
        </div>
        <div class="mp-controls">
            <button class="icon-btn round" id="mpPrev" title="Previous" aria-label="Previous">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 5v14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M19 6l-9 6 9 6V6z" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn round primary" id="mpToggle" title="Play/Pause" aria-label="Play/Pause">
                <svg id="mpPlayIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7-11-7z" fill="currentColor"/></svg>
            </button>
            <button class="icon-btn round" id="mpNext" title="Next" aria-label="Next">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 5v14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5 6l9 6-9 6V6z" fill="currentColor"/></svg>
            </button>
        </div>
        <div class="mp-progress">
            <span class="mp-time" id="mpCur">0:00</span>
            <div class="mp-bar" id="mpBar"><span class="mp-fill" id="mpFill" style="width:0%"></span></div>
            <span class="mp-time" id="mpDur">0:00</span>
        </div>
        <audio id="mpAudio"></audio>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 MoodHarmonics. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js', v=3) }}"></script>
</body>
</html>
