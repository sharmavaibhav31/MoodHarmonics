<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MoodHarmonics</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="brand">Mood<span>Harmonics</span></div>
    <nav class="tabs" role="navigation">
      <button class="tab-btn" data-target="home"><span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" stroke="currentColor" stroke-width="1.5"/></svg></span><span>Home</span></button>
      <button class="tab-btn" data-target="generate"><span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 4v12a4 4 0 1 0 0 8c2.2 0 4-1.8 4-4V10h6V4H8z" stroke="currentColor" stroke-width="1.5"/></svg></span><span>Generate</span></button>
      <button class="tab-btn" data-target="playlist"><span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 6h14M3 12h10M3 18h14M18 7v10a3 3 0 1 0 0-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Playlist</span></button>
      <button class="tab-btn" data-target="library"><span class="icon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="6" height="16" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="4" width="11" height="16" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg></span><span>Library</span></button>
      <span class="tab-active-underline" aria-hidden="true"></span>
    </nav>
    <div class="actions">
      <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"><svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <a class="small-link" href="{{ url_for('login') }}">Login</a>
    </div>
  </header>

  <main id="app">
    {% block content %}{% endblock %}
  </main>

  <div id="lyricsModal" class="modal hidden">
    <div class="modal-inner">
      <button class="close-btn" id="closeLyrics">✕</button>
      <h3 id="modalTitle">Lyrics</h3>
      <pre id="modalLyrics"></pre>
    </div>
  </div>

  <div id="nowPlaying" class="now-playing hidden" aria-live="polite">
    <div class="np-left">
      <div class="np-cover"></div>
      <div class="np-meta">
        <div class="np-title">Not playing</div>
        <div class="np-subtitle">—</div>
      </div>
    </div>
    <div class="np-controls">
      <button id="npPrev" class="icon-btn" title="Previous" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6v12M20 18l-10-6 10-6v12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button id="npToggle" class="icon-btn" title="Play/Pause" aria-label="Play/Pause"><svg class="np-play" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7-11-7z" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button id="npNext" class="icon-btn" title="Next" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6v12M4 18l10-6L4 6v12z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
    </div>
    <div class="np-progress">
      <div class="np-bar"><span class="np-fill" style="width:0%"></span></div>
      <audio id="npAudio"></audio>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
