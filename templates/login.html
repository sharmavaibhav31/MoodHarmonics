<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MoodHarmonics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page page-enter">
    <div class="animated-bg">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
    </div>

    <main class="center-screen">
        <div class="login-card glass">
            <h1>Welcome Back</h1>
            <form id="loginForm" class="login-form" novalidate>
                <input type="email" id="email" placeholder="Email" required pattern="^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$">
                <input type="password" id="password" placeholder="Password" required minlength="6">
                <div id="signupExtra" class="hidden">
                    <input type="password" id="confirm" placeholder="Confirm Password" minlength="6">
                </div>
                <button type="submit" class="btn primary glow" data-ripple id="loginSubmit">Login</button>
            </form>
            <p class="login-note">New here? <a href="#" id="toggleSignup">Create an account</a></p>
            <p class="login-note" id="loginError" style="color:#ff6b6b"></p>
        </div>
    </main>
</body>
