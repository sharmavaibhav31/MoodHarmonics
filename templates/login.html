<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MoodHarmonics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page page-enter">
    <div class="animated-bg">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
    </div>
    <main class="center-screen">
        <div class="login-card glass">
            <h1>Welcome Back</h1>
            <form action="{{ url_for('dashboard') }}" class="login-form">
                <input type="text" placeholder="Username" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn primary glow" data-ripple>Login</button>
            </form>
            <p class="login-note">No account yet? Just log in — this is a demo mode.</p>
        </div>
    </main>
</body>
</html>
