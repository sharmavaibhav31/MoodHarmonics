{% extends "base.html" %}

{% block title %}Dashboard - MoodHarmonics{% endblock %}

{% block content %}
<section class="dashboard-section">
    <div class="dashboard-container">
        <h1 class="section-title">Create Your Music</h1>

        <div class="generation-panel">
            <div class="input-group">
                <label for="genPrompt">Describe Your Mood</label>
                <textarea
                    id="genPrompt"
                    class="input-field"
                    rows="3"
                    placeholder="E.g., I'm feeling nostalgic and reflective, thinking about summer nights..."
                ></textarea>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="genreSelect">Genre</label>
                    <select id="genreSelect" class="input-field">
                        <option value="">Select Genre</option>
                        <option value="pop">Pop</option>
                        <option value="rock">Rock</option>
                        <option value="jazz">Jazz</option>
                        <option value="electronic">Electronic</option>
                        <option value="classical">Classical</option>
                        <option value="hiphop">Hip Hop</option>
                        <option value="indie">Indie</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="tempoSelect">Tempo</label>
                    <select id="tempoSelect" class="input-field">
                        <option value="">Select Tempo</option>
                        <option value="slow">Slow</option>
                        <option value="medium">Medium</option>
                        <option value="fast">Fast</option>
                        <option value="variable">Variable</option>
                    </select>
                </div>
            </div>

            <div class="input-row" style="gap:8px">
                <button class="generate-button" id="genBtn">
                    Generate
                    <span class="button-glow"></span>
                </button>
                <button class="action-button" id="randBtn">Random Prompt</button>
                <span id="genStatus" class="muted"></span>
            </div>
        </div>

        <div class="results-panel" id="genResult" style="display: none;">
            <div class="results-grid">
                <div class="audio-section">
                    <h3>Your Music</h3>
                    <div class="audio-player-container">
                        <audio id="audioPlayer" controls class="audio-player">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                    <div class="player-actions">
                        <button class="action-button" id="downloadBtn">
                            <span>⬇</span> Download
                        </button>
                        <button class="action-button" id="saveBtn">
                            <span>💾</span> Save to Library
                        </button>
                    </div>
                </div>

                <div class="lyrics-section">
                    <h3>Lyrics</h3>
                    <div class="lyrics-box" id="lyricsBox">
                        <p class="lyrics-placeholder">Your lyrics will appear here...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
